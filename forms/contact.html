<form action="https://api.web3forms.com/submit"

    name="access_key"

  <input type="hidden"
    name="subject"
    value="New Portfolio Contact Message">

  <input type="hidden"
    name="from_name"
    value="Sourav Majee Portfolio">

  <div class="row gy-4">

    <div class="col-md-6">

      <input type="text"
        name="name"
        class="form-control"

    </div>

    <div class="col-md-6">
